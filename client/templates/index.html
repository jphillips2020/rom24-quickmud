<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ROM MUD Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #header h1 {
      font-size: 16px;
      color: #58a6ff;
      letter-spacing: 2px;
    }
    #status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #238636;
      color: #aff;
    }
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #output br { display: block; }
    #input-area {
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #prompt-label {
      color: #58a6ff;
      font-weight: bold;
      white-space: nowrap;
    }
    #cmd {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      font-family: inherit;
      font-size: 14px;
      padding: 6px 10px;
      outline: none;
    }
    #cmd:focus { border-color: #58a6ff; }
    #send-btn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 16px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    #send-btn:hover { background: #2ea043; }
    .echo {
      color: #8b949e;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>&#9876; ROM MUD</h1>
    <span id="status">connecting...</span>
  </div>
  <div id="output"></div>
  <div id="input-area">
    <span id="prompt-label">&gt;</span>
    <input id="cmd" type="text" placeholder="Enter command..." autofocus autocomplete="off">
    <button id="send-btn">Send</button>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const output = document.getElementById('output');
    const cmdInput = document.getElementById('cmd');
    const statusEl = document.getElementById('status');
    const history = [];
    let histIdx = -1;

    const socket = io();

    socket.on('connect', () => {
      statusEl.textContent = 'connected';
      statusEl.style.background = '#238636';
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'disconnected';
      statusEl.style.background = '#da3633';
    });

    socket.on('output', (data) => {
      const div = document.createElement('div');
      div.innerHTML = data.html;
      output.appendChild(div);
      output.scrollTop = output.scrollHeight;
    });

    function sendCommand() {
      const cmd = cmdInput.value;
      if (cmd.trim() === '' && cmd !== '') return;
      // echo the command
      const echo = document.createElement('div');
      echo.className = 'echo';
      echo.textContent = '> ' + cmd;
      output.appendChild(echo);
      output.scrollTop = output.scrollHeight;

      socket.emit('command', { cmd });
      if (cmd.trim()) {
        history.unshift(cmd);
        if (history.length > 100) history.pop();
      }
      histIdx = -1;
      cmdInput.value = '';
    }

    document.getElementById('send-btn').addEventListener('click', sendCommand);
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendCommand();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histIdx < history.length - 1) {
          histIdx++;
          cmdInput.value = history[histIdx];
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx > 0) {
          histIdx--;
          cmdInput.value = history[histIdx];
        } else {
          histIdx = -1;
          cmdInput.value = '';
        }
      }
    });
  </script>
</body>
</html>
